<div class="lyFilterbar lyFilterbar--minimal">
	<div class="lyFilterbar__container">
		<div class="lyFilterbar__blocks">
			<!-- filter: type alerts -->
			<div class="lyFilterbar__itemset f-types" [class]="'actionTypesGA'">
				<div class="lyFilterbar__wrap">
					@for (filter of filterTypes; track filter.type) {
					<p-button
						class="prButton"
						severity="secondary"
						label="{{ filter.termKey | term : globalTermService.languageCode }}"
						[class.is-active]="activeTypes().includes(filter.type)"
						(click)="ToggleType(filter.type)"
					/>
					}
				</div>
			</div>
