@if (visible()) {
<div class="ptListitemNotification ptListitemNotification--simple" [class.ptListitemNotification--hiding]="!status()" [ngStyle]="{ '--duration-message': durationMessage() }">
	<!-- MAIN -->
	<div class="ptListitemNotification__main" [ngStyle]="{ cursor: cursorStyle }" (click)="onNotificationClick.emit(notification)">
		<div class="ptListitemNotification__header">
			<!-- CARD -->
			<p-card class="prCard prCard--compact">
				<ng-template #title>
					<div class="prCard__row">
						<div class="prCard__title u-color-primary"></div>
						<div class="prCard__wrap">
							<p-button
								class="prButton prButton--autoWidth prButton--borderTransparent"
								severity="secondary"
								icon="icon icon-cancel"
								size="small"
								(click)="onCloseNotification($event, notification)"
								[disabled]="isBusy(notification.recipientId, actionClose)"
							/>
						</div>
					</div>
				</ng-template>
				<ng-template #content>
					<div class="prCard__title">{{ body?.text }}</div>
					<div class="prCard__row">
						<p-badge class="prBadge icon {{ body?.badge?.icon }}" severity="warn" badgeSize="small" [value]="domain.getTerm(body?.badge?.termCode)" />
					</div>
					<div class="prCard__row u-ms-auto">
						<span class="u-bold">{{ domain.getTerm("LBL_UPLOADED_ON") }} {{ notification.createdAt | date : 'd MMM, y' }}</span>
					</div>
				</ng-template>
			</p-card>
		</div>
		<div class="ptListitemNotification__footer">
			<div class="ptListitemNotification__actions" *ngIf="notification.actions?.length">
				<p-button
					*ngFor="let action of notification.actions"
					class="prButton"
					[severity]="domain.getSeverity(domain.getJsonData(action.metaData)?.severity)"
					icon="icon {{ domain.getJsonData(action.metaData)?.icon }}"
					tooltipStyleClass="prTooltip"
					tooltipPosition="top"
					pTooltip="{{ domain.getTerm(domain.getJsonData(action.metaData)?.termCode) }}"
					(click)="onActionClick($event, notification, action)"
					[disabled]="isBusy(notification.recipientId, action.code)"
				/>
			</div>
		</div>
	</div>
</div>
}
